<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b"/>
      <stop offset="50%" stop-color="#047857"/>
      <stop offset="100%" stop-color="#022c22"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="#070b14"/>

  <!-- Icon Container with Glow & Gradient -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bgGrad)" stroke="#10b981" stroke-width="6" stroke-opacity="0.4" filter="url(#shadow)"/>

  <!-- Shield contour subtle -->
  <path d="M 256 70 Q 370 70 390 170 Q 390 320 256 420 Q 122 320 122 170 Q 142 70 256 70 Z" 
        fill="none" stroke="#34d399" stroke-width="3" stroke-dasharray="12 8" opacity="0.4"/>

  <!-- Glowing Lightning Bolt Symbol (Zap) -->
  <g filter="url(#glow)">
    <path d="M 280 100 L 160 270 L 250 270 L 220 412 L 360 236 L 272 236 Z" 
          fill="url(#boltGrad)" 
          stroke="#ffffff" 
          stroke-width="4" 
          stroke-linejoin="round"/>
  </g>

  <!-- Subtitle Badge RS -->
  <g transform="translate(256, 440)">
    <rect x="-60" y="-18" width="120" height="26" rx="13" fill="#070b14" stroke="#059669" stroke-width="2" opacity="0.9"/>
    <text x="0" y="0" fill="#34d399" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="13" letter-spacing="3" text-anchor="middle" dominant-baseline="central">RÁPIDO &amp; SEGURO</text>
  </g>
</svg>
